name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Typecheck, testy a build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./ci.db
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Zjistit verzi pnpm z package.json
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: Nainstalovat pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Nainstalovat Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Nainstalovat závislosti
        run: pnpm install --frozen-lockfile

      - name: Kontrola typů
        run: pnpm typecheck

      - name: Testy
        run: pnpm test

      - name: Migrace databáze pro build
        run: pnpm db:migrate

      - name: Build
        run: pnpm build
