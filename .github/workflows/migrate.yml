name: Migrace produkční databáze

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    name: Migrovat Turso
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Zkontrolovat, že jsou nastavená tajemství
        id: check-secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::warning::Tajemství TURSO_DATABASE_URL a/nebo TURSO_AUTH_TOKEN nejsou v repozitáři nastavená (Settings → Secrets and variables → Actions). Migrace se přeskakuje."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Zjistit verzi pnpm z package.json
        if: steps.check-secrets.outputs.configured == 'true'
        id: pnpm-version
        run: echo "version=$(node -p "require('./package.json').packageManager.split('@')[1]")" >> "$GITHUB_OUTPUT"

      - name: Nainstalovat pnpm
        if: steps.check-secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Nainstalovat Node.js
        if: steps.check-secrets.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Nainstalovat závislosti
        if: steps.check-secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      - name: Spustit migrace nad Turso
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: pnpm db:migrate

      - name: Nasadit vestavěné šablony
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        # `tests.templateId` je NOT NULL s cizím klíčem na `templates`; bez šablon
        # by v nasazení nešlo uložit test. Seed je idempotentní (konflikt na `slug`),
        # takže smí běžet po každé migraci.
        run: pnpm db:seed
