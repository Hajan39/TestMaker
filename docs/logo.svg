<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="TestMaker">
  <title>TestMaker</title>

  <!-- Značka: list papíru s opravenou fajfkou -->
  <g transform="translate(0 20) scale(0.3125)">
    <rect width="512" height="512" rx="112" fill="#0d7355"/>
    <rect x="128" y="92" width="256" height="328" rx="28" fill="#ffffff"/>
    <rect x="170" y="150" width="172" height="22" rx="11" fill="#cfe6de"/>
    <rect x="170" y="198" width="120" height="22" rx="11" fill="#cfe6de"/>
    <path d="M176 288 L 218 330 L 310 232" fill="none" stroke="#0d7355" stroke-width="36"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Název: tmavá část je nástroj, zelená je to, co dělá -->
  <text x="212" y="130" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="104" font-weight="700" letter-spacing="-3">
    <tspan fill="#0c0e12">Test</tspan><tspan fill="#0d7355">Maker</tspan>
  </text>
</svg>
